<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside style="height:100%;background:#fff;border-radius:20px;padding:20px 14px;display:flex;flex-direction:column;gap:2px;color:#4B544D;font-family:Geist,sans-serif">
<div style="display:flex;align-items:center;gap:10px;padding:0 8px 16px"><div style="width:38px;height:38px;border-radius:11px;background:#0F4D35;color:#fff;display:grid;place-items:center"><span style="font:22px/1 'Material Symbols Rounded'">star</span></div><div><div style="font-weight:700;color:#121A15;font-size:16px">Negroni</div><div style="font-size:11.5px;color:#7A827C">Management OS</div></div></div>
<sc-for list="{{ nav }}" as="g" hint-placeholder-count="3">
<div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8A928C;padding:14px 12px 6px;font-weight:600">{{ g.label }}</div>
<sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
<sc-if value="{{ it.active }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#0F4D35;color:#fff;font-weight:600;font-size:14px"><span style="font:20px/1 'Material Symbols Rounded'">{{ it.icon }}</span>{{ it.name }}</div></sc-if>
<sc-if value="{{ it.idle }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;font-weight:500;font-size:14px"><span style="font:20px/1 'Material Symbols Rounded'">{{ it.icon }}</span><span style="flex:1">{{ it.name }}</span><sc-if value="{{ it.count }}" hint-placeholder-val="{{ false }}"><span style="background:#D4F57A;color:#1F3A10;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px">{{ it.count }}</span></sc-if></div></sc-if>
</sc-for>
</sc-for>
<div style="margin-top:auto;padding:16px;border-radius:16px;background:#0F4D35;color:#E3F0E8;font-size:12.5px;line-height:1.5;display:flex;flex-direction:column;gap:10px"><div><div style="color:#fff;font-weight:600;font-size:14px">Signed in as CEO</div><div style="opacity:.8">Entire holding · 27 of 27 permissions</div></div><span style="background:#fff;color:#0F4D35;border-radius:10px;padding:8px;text-align:center;font-weight:600">Account &amp; theme</span></div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:248,&quot;height&quot;:980},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Dashboard';
    const groups = [
      ['Workspace', [['Dashboard','home'],['Tasks','task_alt'],['Projects','folder'],['Approvals','approval'],['Operations','speed']]],
      ['Business', [['Financial Overview','donut_large'],['Financial System','shield'],['Finance','account_balance'],['Reports','bar_chart'],['Companies','apartment'],['People','group']]],
      ['Tools', [['Documents','description'],['Calendar','calendar_month'],['Notifications','notifications','3'],['Settings','settings']]]
    ];
    return { nav: groups.map(([label, items]) => ({ label, items: items.map(([name, icon, count]) => ({ name, icon, count: count || '', active: name === active, idle: name !== active })) })) };
  }
}
</script>
</body>
</html>
